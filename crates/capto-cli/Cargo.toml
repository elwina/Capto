[package]
name = "capto-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Capto command-line interface"

[[bin]]
name = "capto-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
capto-core = { workspace = true }
capto-capture = { workspace = true }
capto-encode = { workspace = true }
capto-overlay = { workspace = true }
capto-audio = { workspace = true }
