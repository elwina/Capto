[package]
name = "capto-app"
version.workspace = true
description = "Capto desktop shell"
authors.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "capto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
capto-core = { workspace = true }
capto-capture = { workspace = true }
capto-audio = { workspace = true }
capto-encode = { workspace = true }
capto-overlay = { workspace = true }
capto-hooks = { workspace = true }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
axum = { workspace = true }
tower = { workspace = true }
http = { workspace = true }
capto-ipc = { workspace = true }
uuid = { workspace = true }
tauri-plugin-process = "2.3.1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.10.1"

[dev-dependencies]
tempfile = "3"
