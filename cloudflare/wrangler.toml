# Cloudflare Worker config for the Capto updater mirror.
# Deploy:  npx wrangler deploy   (from this directory)
# Local:   npx wrangler dev

name = "capto-update-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"

# Optional: bind a custom domain / route instead of the default *.workers.dev.
# routes = [
#   { pattern = "updates.example.com", custom_domain = true },
# ]

# GitHub releases are public, so no bindings are required.
# If GH_TOKEN is ever needed, define it as a secret:
#   npx wrangler secret put GH_TOKEN