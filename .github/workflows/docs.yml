name: Docs

# Publishes rustdoc for the workspace (library crates + CLI) to GitHub Pages.
# `capto-app` (the Tauri shell) is excluded: its docs require staged external
# binaries at doc-time and the UI is documented in docs/ARCHITECTURE.md anyway.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (native libraries for lib crates)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libdbus-1-dev libx11-dev libxi-dev libxtst-dev pkg-config
      - name: cargo doc
        run: cargo doc --workspace --no-deps --exclude capto-app
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
