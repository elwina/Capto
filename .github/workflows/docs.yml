name: Docs

# Publishes rustdoc for the workspace (library crates + CLI) to GitHub Pages.
# `capto-app` (the Tauri shell) is excluded: its docs require staged external
# binaries at doc-time and the UI is documented in docs/ARCHITECTURE.md anyway.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (retrying; GitHub apt mirrors are flaky)
        shell: bash
        run: |
          set -euo pipefail
          pkgs="libasound2-dev libudev-dev libdbus-1-dev libx11-dev libxi-dev libxtst-dev pkg-config"
          for i in 1 2 3 4 5; do
            if sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y $pkgs; then
              exit 0
            fi
            echo "apt attempt $i failed, retrying in 30s"
            sleep 30
          done
          echo "apt install failed after 5 attempts" >&2
          exit 1
      - name: cargo doc
        run: cargo doc --workspace --no-deps --exclude capto-app
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
