name: Docs

# Publishes rustdoc for the workspace (library crates + CLI) to GitHub Pages.
# `capto-app` (the Tauri shell) is excluded: its docs require staged external
# binaries at doc-time and the UI is documented in docs/ARCHITECTURE.md anyway.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build rustdoc
    # Windows: the workspace's native dep crates (cpal/WASAPI, no alsa/dbus
    # on Windows) compile without any system packages, so this job avoids the
    # flaky ubuntu apt mirrors entirely. The workspace already builds on
    # windows-latest in the CI workflow.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo doc
        run: cargo doc --workspace --no-deps --exclude capto-app
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
