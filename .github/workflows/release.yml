name: Release

# Windows x64 + arm64 installers with FFmpeg embedded from elwina/capto-ffmpeg
# (SHA-256 + Artifact Attestation). Separate from CI.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: "Create draft GitHub release"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: release-${{ matrix.arch }}

      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci

      - name: Download Capto FFmpeg (${{ matrix.arch }})
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAPTO_FFMPEG_VERIFY_ATTESTATION: "1"
        run: |
          .\scripts\download-ffmpeg.ps1 -TargetTriple "${{ matrix.target }}" -VerifyAttestation
          Get-Item "apps/desktop/src-tauri/binaries/ffmpeg-${{ matrix.target }}.exe" | Format-List Name, Length

      - name: Build CLI (`capto`)
        run: cargo build -p capto-cli --release --target ${{ matrix.target }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v5
        with:
          name: capto-cli-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/capto.exe
          if-no-files-found: error

      - name: Build Tauri installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: Capto v__VERSION__
          releaseBody: |
            Capto **v__VERSION__** (Windows).

            - Bundled FFmpeg from [`elwina/capto-ffmpeg`](https://github.com/elwina/capto-ffmpeg) (SHA-256 + attestation; pin in `.github/capto-ffmpeg.env`)
            - Architectures: **x64**, **arm64**
            - Installer: NSIS `.exe` setup
            - CLI: `capto-windows-x64.exe` / `capto-windows-arm64.exe`

            Install the setup matching your CPU.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          args: --target ${{ matrix.target }} --bundles nsis

  attach-cli:
    name: Attach CLI to release
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Rename CLI assets
        run: |
          mkdir -p out
          cp artifacts/capto-cli-x64/capto.exe out/capto-windows-x64.exe
          cp artifacts/capto-cli-arm64/capto.exe out/capto-windows-arm64.exe
          ls -la out

      - name: Upload CLI to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/capto-windows-x64.exe
            out/capto-windows-arm64.exe
          fail_on_unmatched_files: true
