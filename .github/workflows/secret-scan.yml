name: Secret scanning

# Gitleaks finds hardcoded secrets (API keys, tokens, private keys) in the
# repo history and working tree. Complements GitHub's (currently disabled)
# secret scanning, which only catches known provider patterns. Redacted scan
# results are uploaded as a SARIF into the Security tab on default-branch
# scans (see the gitleaks-action README for SARIF upload flags).
#
# See docs/runbooks/security.md for response steps if this fires.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write # upload SARIF (gitleaks-action)

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so pushes that add then scrub a secret still trip.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
