name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  attestations: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust test / clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Download Capto FFmpeg (host)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAPTO_FFMPEG_VERIFY_ATTESTATION: "1"
        run: |
          # Tauri externalBin requires ffmpeg-<host-triple>.exe when building capto-app.
          .\scripts\download-ffmpeg.ps1 -VerifyAttestation

      - name: Stage CLI for Tauri resources
        shell: pwsh
        run: |
          # tauri.conf.json bundles binaries/capto.exe as resources — build.rs fails if missing.
          cargo build -p capto-cli
          .\scripts\copy-cli.ps1 -Profile debug

      - name: Test capto-dsh-plugin against real CLI
        shell: pwsh
        run: |
          # target/debug/capto.exe was built above; the plugin's real-CLI
          # smoke check exercises the desktopUnavailable (exit 2) path on CI.
          Push-Location packages/capto-dsh-plugin
          npm ci --no-audit --no-fund
          node test/smoke.mjs

      - name: cargo test --workspace
        run: cargo test --workspace --all-targets

      - name: cargo clippy --workspace
        # Warn-only for now; tighten to `-D warnings` once the workspace is clean.
        run: cargo clippy --workspace --all-targets

  frontend:
    name: Frontend lint + tests + typecheck
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit

  check-targets:
    name: Check ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: check-${{ matrix.arch }}

      - name: Download Capto FFmpeg (${{ matrix.arch }})
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAPTO_FFMPEG_VERIFY_ATTESTATION: "1"
        run: |
          .\scripts\download-ffmpeg.ps1 -TargetTriple "${{ matrix.target }}" -VerifyAttestation
          $path = "apps/desktop/src-tauri/binaries/ffmpeg-${{ matrix.target }}.exe"
          if (-not (Test-Path $path)) { throw "missing $path" }
          Write-Host "OK $path ($((Get-Item $path).Length) bytes)"

      - name: Stage CLI for Tauri resources
        shell: pwsh
        run: |
          cargo build -p capto-cli --target ${{ matrix.target }}
          .\scripts\copy-cli.ps1 -TargetTriple "${{ matrix.target }}" -Profile debug
          if (-not (Test-Path "apps/desktop/src-tauri/binaries/capto.exe")) {
            throw "missing apps/desktop/src-tauri/binaries/capto.exe"
          }

      - name: cargo check (desktop + cli)
        run: cargo check -p capto-app -p capto-cli --target ${{ matrix.target }}

  packages:
    name: Agent packages (skill + dsh plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: npm pack dry-run (skill)
        run: npm pack ./packages/capto-agent-skill --dry-run
      - name: Test capto-dsh-plugin (fake CLI)
        working-directory: packages/capto-dsh-plugin
        run: |
          npm ci --no-audit --no-fund
          node test/smoke.mjs
      - name: npm pack dry-run (plugin)
        working-directory: packages/capto-dsh-plugin
        run: npm pack --dry-run
